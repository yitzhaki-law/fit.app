<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitQuest Pro</title>
    
    <!-- MediaPipe Pose מ-CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg: #0a0a0a;
            --bg2: #111111;
            --bg3: #1a1a1a;
            --bg4: #252525;
            --g: #00e676;
            --g2: #00c853;
            --red: #ff5252;
            --warn: #ffab40;
            --text: #ffffff;
            --text-dim: #b0b0b0;
            
            /* צבעי אייקונים ייעודיים */
            --icon-profile: #4fc3f7;
            --icon-group: #ba68c8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-left: 1px solid var(--bg3);
            border-right: 1px solid var(--bg3);
        }

        .top-bar {
            height: 60px;
            background-color: var(--bg2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--bg3);
            z-index: 10;
        }

        .top-bar h1 {
            font-size: 20px;
            color: var(--g);
            font-weight: bold;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 22px;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* ניווט תחתון משופר עם צבעים */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: var(--bg2);
            border-top: 1px solid var(--bg3);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 12px;
            cursor: pointer;
            flex: 1;
            padding: 8px 0;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
            transition: transform 0.2s;
        }

        .nav-item.active {
            color: var(--g);
            font-weight: bold;
        }

        /* צבעים ייחודיים לאייקונים ספציפיים כשהם פעילים */
        .nav-item[data-tab="profile"].active i { color: var(--icon-profile); }
        .nav-item[data-tab="group"].active i { color: var(--icon-group); }

        /* מבנה דירוג עם Sidebar מותאם שפה */
        .leaderboard-layout {
            display: flex;
            height: 100%;
            gap: 12px;
        }

        html[dir="rtl"] .sidebar-nav {
            border-left: 1px solid var(--bg3);
            padding-left: 8px;
        }

        html[dir="ltr"] .sidebar-nav {
            border-right: 1px solid var(--bg3);
            padding-right: 8px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 85px;
        }

        .sidebar-btn {
            background-color: var(--bg2);
            border: 1px solid var(--bg3);
            color: var(--text-dim);
            padding: 10px 6px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 6px;
            text-align: center;
        }

        .sidebar-btn.active {
            background-color: var(--g);
            color: var(--bg);
            font-weight: bold;
            border-color: var(--g);
        }

        .leaderboard-content {
            flex: 1;
            overflow-y: auto;
        }

        /* מפת שלבים בסללום - גלילה מלמטה למעלה */
        .stages-map-container {
            display: flex;
            flex-direction: column-reverse; /* גורם לשלב 1 להיות למטה */
            gap: 20px;
            padding: 20px 10px;
            background: linear-gradient(rgba(0,230,118,0.03) 1px, transparent 1px) 0 0 / 20px 20px, var(--bg);
        }

        .stage-row {
            display: flex;
            align-items: center;
            position: relative;
            width: 100%;
            height: 60px;
        }

        /* קווי חיבור מתפתלים בסללום */
        .stage-row::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 50%;
            height: 4px;
            background: var(--bg3);
            z-index: 1;
        }

        /* כיווני הפסים משתנים לפי אי זוגי/זוגי ליצירת זיגזג */
        .stage-row.left-curve { justify-content: flex-start; }
        .stage-row.left-curve::after { left: 25%; }
        
        .stage-row.right-curve { justify-content: flex-end; }
        .stage-row.right-curve::after { right: 25%; }

        .stage-row.center-row { justify-content: center; }
        .stage-row.center-row::after { width: 60%; left: 20%; }

        .stage-node {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--bg4);
            border: 3px solid var(--bg3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            z-index: 2;
            transition: all 0.2s;
            position: relative;
        }

        .stage-node.completed {
            background-color: var(--g2);
            border-color: var(--g);
            color: var(--bg);
        }

        .stage-node.current {
            background-color: var(--warn);
            border-color: #fff;
            color: var(--bg);
            box-shadow: 0 0 12px var(--warn);
        }

        .stage-node.locked {
            background-color: #1a1a1a;
            border-color: #2a2a2a;
            color: #555;
            cursor: not-allowed;
        }

        /* מסך התחברות */
        #auth-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-dim);
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg2);
            border: 1px solid var(--bg3);
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--g);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* מודאל פרטי שלב */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--bg2);
            border: 1px solid var(--bg3);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- מסך התחברות -->
    <div id="auth-screen">
        <h2 style="text-align: center; margin-bottom: 24px; color: var(--g);">FitQuest</h2>
        <div class="input-group">
            <label>שם משתמש / Username</label>
            <input type="text" id="auth-username" placeholder="הכנס שם...">
        </div>
        <div class="input-group">
            <label>סיסמה / Password</label>
            <input type="password" id="auth-password" placeholder="הכנס סיסמה...">
        </div>
        <div class="input-group">
            <label>שפה / Language</label>
            <select id="auth-lang" onchange="toggleDirection(this.value)">
                <option value="he">עברית 🇮🇱</option>
                <option value="en">English 🇺🇸</option>
            </select>
        </div>
        <button class="btn" onclick="handleAuth()">התחבר / Sign In</button>
    </div>

    <!-- בר עליון -->
    <div class="top-bar">
        <h1 id="bar-title">FitQuest</h1>
        <button class="icon-btn" id="top-settings-btn" onclick="switchTab('profile')">⚙️</button>
    </div>

    <!-- תוכן הטאבים -->
    <div class="main-content">
        
        <!-- טאב בית -->
        <div id="tab-home" class="page active">
            <h2>ברוך הבא, <span id="home-user-name">-</span></h2>
            <div id="home-stats" style="margin-top: 20px; background: var(--bg2); padding: 15px; border-radius: 8px;">
                <p>השלב הנוכחי שלך: <strong id="user-current-stage" style="color:var(--warn)">1</strong></p>
            </div>
        </div>

        <!-- טאב אימון -->
        <div id="tab-workout" class="page">
            <div id="workout-setup">
                <h3>התחלת אימון שלב <span id="workout-stage-num">1</span></h3>
                <div id="workout-desc" style="margin: 15px 0; color: var(--text-dim);"></div>
                <button class="btn" onclick="startActiveWorkout()">הפעל מצלמה ואימון</button>
            </div>
            <div id="workout-screen" style="display:none;"></div>
        </div>

        <!-- טאב דירוג המעודכן עם ה-Sidebar הצידי -->
        <div id="tab-leaderboard" class="page" style="height: 100%;">
            <div class="leaderboard-layout">
                <div class="sidebar-nav">
                    <button class="sidebar-btn active" id="btn-glob" onclick="switchLeaderboard('global')">עולמי</button>
                    <button class="sidebar-btn" id="btn-nat" onclick="switchLeaderboard('national')">ארצי</button>
                    <button class="sidebar-btn" id="btn-chal" onclick="switchLeaderboard('challenge')">אתגר</button>
                    <button class="sidebar-btn" id="btn-stg" onclick="switchLeaderboard('stages')">שלבים</button>
                </div>
                <div class="leaderboard-content" id="leaderboard-list">
                    <!-- כאן יוטען לוח השיאים או מפת הסללום -->
                </div>
            </div>
        </div>

        <!-- טאב קבוצה -->
        <div id="tab-group" class="page">
            <h3>הקבוצות שלי</h3>
            <button class="btn" onclick="shareGroupViaWhatsAppLink()">שתף קבוצה בוואצאפ (קישור ישיר)</button>
        </div>

        <!-- טאב פרופיל -->
        <div id="tab-profile" class="page">
            <h3>פרופיל משתמש</h3>
            <button class="btn" style="background-color: var(--icon-profile); color:#000; margin-top:20px;" onclick="sharePRViaWhatsApp()">שתף שיא אישי בוואצאפ</button>
            <div id="admin-panel" style="display:none; margin-top:20px; border-top:1px solid #333; padding-top:20px;">
                <h4 style="color:var(--red)">ADMIN PANEL (טום יצחקי)</h4>
            </div>
        </div>

    </div>

    <!-- ניווט תחתון -->
    <div class="bottom-nav">
        <button class="nav-item active" data-tab="home" onclick="switchTab('home')"><i>🏠</i><span>בית</span></button>
        <button class="nav-item" data-tab="workout" onclick="switchTab('workout')"><i>🏋️‍♂️</i><span>אימון</span></button>
        <button class="nav-item" data-tab="leaderboard" onclick="switchTab('leaderboard')"><i>🏆</i><span>דירוג</span></button>
        <button class="nav-item" data-tab="group" onclick="switchTab('group')"><i>👥</i><span>קבוצה</span></button>
        <button class="nav-item" data-tab="profile" onclick="switchTab('profile')"><i>👤</i><span>פרופיל</span></button>
    </div>
</div>

<!-- מודאל פרטי שלב -->
<div id="stage-modal" class="modal">
    <div class="modal-content">
        <h3 id="modal-stage-title">שלב X</h3>
        <div id="modal-stage-details" style="margin: 15px 0; text-align: right; color: var(--text-dim);"></div>
        <div id="modal-actions"></div>
        <button class="btn" style="background:var(--bg3); color:white; margin-top:10px;" onclick="closeStageModal()">סגור</button>
    </div>
</div>
